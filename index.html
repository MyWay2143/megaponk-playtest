<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#21180f">
<title>MegaPonk</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#21180f;color:#f4dfbb}
body{display:grid;place-items:center;font-family:Georgia,serif;overflow:hidden}
#screen{position:fixed;inset:0;background:#21180f}
main{position:absolute;inset:0}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
#loading{position:absolute;inset:0;display:grid;align-content:center;justify-items:center;gap:1em;text-align:center;padding:1em;background:#21180f}
#loading[hidden]{display:none}h1{font-size:2.4rem;margin:0}progress{width:65%;accent-color:#c9a158}
#fullscreen{position:absolute;z-index:2;right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:42px;height:42px;border:1px solid #bfa273;border-radius:8px;background:#281e17e6;color:#ffe8b9;cursor:pointer;display:grid;place-items:center}
#fullscreen svg{width:22px;height:22px}#fullscreen:focus-visible{outline:2px solid #ffe8b9;outline-offset:2px}
#screen.expanded #fullscreen{opacity:0;transition:opacity .2s}
#screen.expanded #fullscreen:hover,#screen.expanded #fullscreen:focus-visible{opacity:1}
#screen.expanded #fullscreen svg{transform:rotate(180deg)}
#fullscreen-tip{position:absolute;z-index:3;right:8px;bottom:55px;max-width:18rem;padding:.75rem;border-radius:6px;background:#281e17;color:#ffe8b9}
@media(display-mode:standalone){#fullscreen{display:none}}
</style>
<link rel="stylesheet" href="loading.css?v=5ecc34e92fa11d80">
<link rel="preload" as="image" href="loading-leather.webp?v=80fb6e44a9a252b8">
</head>
<body>
<div id="screen"><main><canvas id="game" tabindex="0" aria-label="MegaPonk"></canvas>
<section id="nickname-screen" aria-labelledby="nickname-title" hidden><form id="nickname-form"><div class="nickname-ornament">✦</div><h1 id="nickname-title">Как тебя зовут?</h1><p>Твой ник будет виден другим игрокам</p><label for="nickname-input">Имя героя</label><input id="nickname-input" name="nickname" maxlength="16" minlength="2" autocomplete="nickname" spellcheck="false" required aria-describedby="nickname-help"><p id="nickname-help">2–16 букв или цифр. Можно использовать _ и -</p><button type="submit">Продолжить</button></form></section>
<div id="loading" hidden><div class="book-stage"><img class="book-binding" src="loading-book.jpg?v=a3610bb494fec501" alt=""><div class="book-front"><img src="loading-tree.webp?v=5d5cab3251c696d2" alt="MegaPonk — обложка книги" fetchpriority="high"><div class="book-meter" role="progressbar" aria-label="Загрузка игры" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="book-meter-fill"></div></div><span class="book-percent" aria-label="Загружено 0 процентов">0%</span></div></div><div id="loading-error" role="alert" hidden>Не удалось загрузить игру. Проверь соединение и попробуй ещё раз.<button id="loading-retry" type="button">Повторить</button></div></div></main>
<button id="fullscreen" type="button" aria-label="На весь экран" title="На весь экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path id="corners" d="M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6"/></svg></button>
<span id="fullscreen-tip" role="status" hidden></span></div>
<script src="loading-book.js?v=ed6d0236e454b1d1"></script>
<script src="loading.js?v=9e2d9dbd3d2aa042"></script>
<script src="Build/Web.loader.js?v=8969de52d2ea7aa2"></script>
<script>
const canvas=document.getElementById("game"), loading=document.getElementById("loading");
const frame=document.getElementById("screen"), full=document.getElementById("fullscreen"), tip=document.getElementById("fullscreen-tip");
function syncFullscreen(){
  const on=Boolean(document.fullscreenElement||document.webkitFullscreenElement);
  frame.classList.toggle("expanded",on);
  const label=on?"Выйти из полного экрана":"На весь экран";
  full.title=label;full.setAttribute("aria-label",label);full.setAttribute("aria-pressed",String(on));
  document.getElementById("corners").setAttribute("d",on?"M9 3v6H3m12-6v6h6M3 15h6v6m6 0v-6h6":"M3 9V3h6m6 0h6v6m0 6v6h-6m-6 0H3v-6");
}
full.addEventListener("click",async()=>{
  tip.hidden=true;
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement) await (document.exitFullscreen||document.webkitExitFullscreen).call(document);
    else if(document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    else if(document.documentElement.webkitRequestFullscreen) document.documentElement.webkitRequestFullscreen();
    else throw new Error();
    canvas.focus();
  }catch{
    tip.textContent=/iPhone|iPad|iPod/.test(navigator.userAgent)?"Чтобы убрать панели Safari, добавь игру на экран «Домой» через «Поделиться».":"Этот браузер не разрешил полноэкранный режим.";
    tip.hidden=false;setTimeout(()=>{tip.hidden=true},6000);
  }
});
document.addEventListener("fullscreenchange",syncFullscreen);document.addEventListener("webkitfullscreenchange",syncFullscreen);
// Limit the number of pixels shaded per frame on high-density displays.
function renderPixelRatio(){
  const pixelBudget = 2560 * 1440;
  const pixels = Math.max(1, canvas.clientWidth * canvas.clientHeight);
  return Math.min(window.devicePixelRatio || 1, 2, Math.max(1, Math.sqrt(pixelBudget / pixels)));
}
window.MegaPonkLoading.beforeLoad(()=>createUnityInstance(canvas,{
  dataUrl:"Build/Web.data.unityweb?v=adc33313219c7aba",frameworkUrl:"Build/Web.framework.js.unityweb?v=b5252c94558cba47",codeUrl:"Build/Web.wasm.unityweb?v=19c5434aac0e7624",
  streamingAssetsUrl:"StreamingAssets",companyName:"MegaPonk",productName:"MegaPonk",
  productVersion:"0.1.0",devicePixelRatio:renderPixelRatio(),
  cacheControl(url) {
    const file = new URL(url, document.baseURI);
    if (/\.(data|wasm|framework\.js)\.unityweb$/.test(file.pathname)) {
      return /^[0-9a-f]{12,64}$/.test(file.searchParams.get("v") || "") ? "immutable" : "must-revalidate";
    }
    return file.pathname.endsWith(".bundle") ? "must-revalidate" : "no-store";
  },
  autoSyncPersistentDataPath:true
},progress=>{window.MegaPonkLoading.progress(progress);}).then(instance=>{
  new ResizeObserver(() => { instance.Module.devicePixelRatio = renderPixelRatio(); }).observe(canvas);
  window.MegaPonkLoading.engineReady();
}).catch(error=>{console.error(error);window.MegaPonkLoading.fail();}));
</script></body></html>
